name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build
  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all
            remove: all
            keep: ''
            expected: android dotnet haskell swift java powershell browsers toolcache docker apt-cache
          - name: selective
            remove: android dotnet java
            keep: dotnet java
            expected: android
    steps:
      - uses: actions/checkout@v4
      - name: Record directory presence
        run: ./smoke.py before
      - uses: ./
        id: prune
        with:
          remove: ${{ matrix.remove }}
          keep: ${{ matrix.keep }}
      - name: Verify cleanup and preserved directories
        env:
          PRUNE_UNITS: ${{ steps.prune.outputs.units }}
          ACTUAL_GROUPS: ${{ steps.prune.outputs.groups }}
          EXPECTED_GROUPS: ${{ matrix.expected }}
        run: ./smoke.py after
      - name: Upload timings and service journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: ${{ runner.temp }}/prune-runner-smoke
          if-no-files-found: error
