name: Prune runner
description: Reclaim runner disk space with background cleanup.
branding:
    icon: trash-2
    color: gray-dark
inputs:
    remove:
        description: Whitespace-separated cleanup groups. Empty removes all supported groups.
        default: ""
runs:
    using: composite
    steps:
        - shell: sh
          env:
              PRUNE_RUNNER_REMOVE: ${{ inputs.remove }}
              PRUNE_RUNNER_ACTION_PATH: ${{ github.action_path }}
          run: '"$PRUNE_RUNNER_ACTION_PATH/prune.sh"'
